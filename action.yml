name: "FixYourSecret"
description: "Catch leaked secrets and frontend exposure in CI, with SARIF for GitHub code scanning."
author: "ssanidhya0407"

branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path to scan."
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails the build: low | medium | high."
    required: false
    default: "high"
  verify:
    description: "Verification mode: none | safe."
    required: false
    default: "safe"
  sarif-file:
    description: "Where to write the SARIF report."
    required: false
    default: "fixyoursecret.sarif"
  upload-sarif:
    description: "Upload the SARIF report to GitHub code scanning (true/false)."
    required: false
    default: "true"
  version:
    description: "npm version/tag of fixyoursecret to run."
    required: false
    default: "latest"
  args:
    description: "Extra arguments passed to the scan."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - id: scan
      shell: bash
      run: |
        set +e
        npx --yes "fixyoursecret@${{ inputs.version }}" ci \
          --path "${{ inputs.path }}" \
          --output-file "${{ inputs.sarif-file }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --verify "${{ inputs.verify }}" ${{ inputs.args }}
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF to code scanning
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: fixyoursecret

    - name: Fail if secrets were found
      shell: bash
      run: |
        if [ "${{ steps.scan.outputs.exit-code }}" != "0" ]; then
          echo "::error::FixYourSecret found secrets at or above the '${{ inputs.fail-on }}' threshold."
          exit 1
        fi
        echo "FixYourSecret: no findings at or above '${{ inputs.fail-on }}'."
